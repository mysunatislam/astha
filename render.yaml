# One free Render preview runs the API and serves the app from the same HTTPS origin. The
# Maira keys stay on the server, so nobody who opens the link needs a key of their own.
#
# Deploy: https://render.com/deploy?repo=https://github.com/mysunatislam/astha
# Render asks for MAIRA_API_KEY, MAIRA_PROJECT_KEY and SUPABASE_DB_URL; they never enter the
# repository or public page. The app is then at the service's https://<name>.onrender.com.
#
# Accounts stay in the selected Supabase project, not the container filesystem. Use the
# restricted backend role's session-pool URL (port 5432). Add the project's verified CA as a
# Render secret file named supabase-root-ca.crt before expecting startup to succeed.
# See README.md and docs/supabase-integration.md. No schema migration runs at startup.
# Free hosting sleeps when idle and is a demo preview, not an always-on production service.
services:
  - type: web
    name: astha
    runtime: docker
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUD_AI_PROVIDER
        value: maira
      - key: MAIRA_API_KEY
        sync: false
      - key: MAIRA_PROJECT_KEY
        sync: false
      - key: DB_PROVIDER
        value: supabase
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_CA_FILE
        value: /etc/secrets/supabase-root-ca.crt
      # PUBLIC_ORIGIN defaults to Render's own RENDER_EXTERNAL_URL; set it for a custom domain.
      # Keep forwarded headers untrusted until the live ingress hop count and header
      # overwrite behavior are verified. Until then the auth limit may group proxy users.
      # Keep a single instance until a shared auth-rate-limit store is reviewed.
      - key: TRUST_PROXY_HOPS
        value: "0"
