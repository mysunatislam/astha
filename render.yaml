# Legacy SQLite hosting example; the selected database is now Supabase.
# Review docs/supabase-integration.md and choose the Node API host before deployment.
# This blueprint still requests a paid service/disk and is not the Supabase cutover config.
services:
  - type: web
    name: astha
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUD_AI_PROVIDER
        value: maira
      - key: MAIRA_API_KEY
        sync: false
      - key: MAIRA_PROJECT_KEY
        sync: false
      - key: MAIRA_PROFILE_ID
        sync: false
      - key: NODE_ENV
        value: production
      # Render terminates TLS before the app. Enter the exact external HTTPS origin.
      # Keep forwarded-header trust disabled until the deployed ingress hop count is verified.
      - key: PUBLIC_ORIGIN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "0"
      - key: DB_PATH
        value: /data/astha.db
      - key: DB_PROVIDER
        value: sqlite
    disk:
      name: astha-data
      mountPath: /data
      sizeGB: 1
