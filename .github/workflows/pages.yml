name: Deploy frontend to GitHub Pages

# GitHub Pages only serves static files -- it cannot run the Express server, hold the Gemini
# key, check passcodes, or write to the database. This publishes web/ (the built PWA shell) to
# a permanent mysunatislam.github.io/astha/ URL, and it talks to whatever API is configured in
# web/config.js. Point that at a real always-on backend (Render, Fly, a VPS) for a fully
# independent deployment; until then it can point at a temporary tunnel.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'server/**'
      - 'package*.json'
      - '.node-version'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - name: Build and verify source before publishing
        run: |
          npm ci --ignore-scripts --no-fund
          npm ci --prefix server --ignore-scripts --no-fund
          npm run check
          npm audit --audit-level=moderate
          npm audit --prefix server --audit-level=moderate
          git diff --exit-code -- web/index.html web/sw.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
