name: Mobile release candidate builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Android version name, for example 1.0.1'
        required: true
        type: string
      version_code:
        description: 'Unused Google Play version code (positive integer)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Web and server regression checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix server
      - name: Run application regression checks
        run: npm run check

  build-android:
    name: Signed Android APK and Google Play AAB
    needs: checks
    runs-on: ubuntu-24.04
    environment: mobile-release
    env:
      ASTHA_VERSION_CODE: ${{ inputs.version_code || vars.ASTHA_ANDROID_VERSION_CODE }}
      ASTHA_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
      ASTHA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ASTHA_ANDROID_KEYSTORE_BASE64 }}
      ASTHA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ASTHA_ANDROID_KEYSTORE_PASSWORD }}
      ASTHA_ANDROID_KEY_ALIAS: ${{ secrets.ASTHA_ANDROID_KEY_ALIAS }}
      ASTHA_ANDROID_KEY_PASSWORD: ${{ secrets.ASTHA_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Set up Android SDK without deprecated tools package
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate release metadata and restore upload keystore
        env:
          ASTHA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/astha-upload.jks
        run: |
          python - <<'PY'
          import base64, os, pathlib, re
          code = os.environ.get('ASTHA_VERSION_CODE', '')
          name = os.environ.get('ASTHA_VERSION_NAME', '').removeprefix('v')
          if not re.fullmatch(r'[1-9][0-9]{0,9}', code) or int(code) > 2100000000:
              raise SystemExit('Provide an unused ASTHA_VERSION_CODE between 1 and 2100000000.')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', name):
              raise SystemExit('Provide ASTHA_VERSION_NAME in major.minor.patch form.')
          if os.environ.get('GITHUB_REF_TYPE') == 'tag' and os.environ['GITHUB_REF_NAME'] != 'v' + name:
              raise SystemExit('Release version must match the v<version> tag.')
          required = ('ASTHA_ANDROID_KEYSTORE_BASE64', 'ASTHA_ANDROID_KEYSTORE_PASSWORD',
                      'ASTHA_ANDROID_KEY_ALIAS', 'ASTHA_ANDROID_KEY_PASSWORD')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing release secrets: ' + ', '.join(missing))
          data = base64.b64decode(os.environ['ASTHA_ANDROID_KEYSTORE_BASE64'], validate=True)
          if not data:
              raise SystemExit('Upload keystore secret is empty.')
          path = pathlib.Path(os.environ['ASTHA_ANDROID_KEYSTORE_PATH'])
          path.write_bytes(data)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('ASTHA_VERSION_NAME=' + name + '\n')
              output.write('ASTHA_ANDROID_KEYSTORE_PATH=' + str(path) + '\n')
          PY
      - name: Build web assets and sync Android
        run: |
          npm ci
          python tools/build.py
          npx cap sync android
      - name: Run Android checks and create signed APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease bundleRelease
      - name: Verify signed artifacts and release manifest
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          jarsigner -J-Duser.language=en -verify "$aab" | tee "$RUNNER_TEMP/aab-signature.txt"
          grep -q 'jar verified\.' "$RUNNER_TEMP/aab-signature.txt"
          test "$(apkanalyzer manifest application-id "$apk")" = com.astha.companion
          test "$(apkanalyzer manifest version-code "$apk")" = "$ASTHA_VERSION_CODE"
          test "$(apkanalyzer manifest version-name "$apk")" = "$ASTHA_VERSION_NAME"
          test "$(apkanalyzer manifest debuggable "$apk")" = false
          sha256sum "$apk" "$aab" > android/app/build/outputs/SHA256SUMS
      - name: Upload verified Android build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: astha-android-${{ env.ASTHA_VERSION_NAME }}-${{ env.ASTHA_VERSION_CODE }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/SHA256SUMS
            android/app/build/reports/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary upload keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/astha-upload.jks"

  build-ios-simulator:
    name: Unsigned iOS simulator compilation (not an IPA)
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - name: Select compliant Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build web assets and sync iOS
        run: |
          npm ci
          python tools/build.py
          npx cap sync ios
      - name: Compile unsigned simulator application
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            -resultBundlePath build/ios-simulator-build.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          test -d build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
      - name: Upload simulator build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: astha-ios-simulator-build-diagnostics
          path: build/ios-simulator-build.xcresult
          if-no-files-found: error
          retention-days: 14
