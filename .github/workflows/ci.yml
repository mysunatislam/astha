name: CI

on:
  push:
    branches: [main, 'production/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          npm ci --prefix server --ignore-scripts --no-fund
      - name: Reproducible web build, syntax checks and regressions
        run: npm run check
      - name: Dependency advisory gates
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix server --audit-level=moderate
      - name: Require committed generated assets to match the source
        run: git diff --exit-code -- web/index.html web/sw.js
      - name: Container isolation, readiness and persistence smoke
        timeout-minutes: 15
        run: node tools/check-container.mjs
